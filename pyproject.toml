[project]
name = "rabbitmq-practice"
version = "0.1.0"
description = "Learning project: Celery + RabbitMQ patterns (fan-out, retry, polling, sequential chain) with a simulated WhatsApp pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
]

[project.scripts]
rabbitmq-practice = "rabbitmq_practice:main"

[tool.pytest.ini_options]
pythonpath = ["whatsapp_pipeline"]
testpaths = ["whatsapp_pipeline/tests"]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
